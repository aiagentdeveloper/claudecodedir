name: Sponsor application
description: Apply for a featured listing, category sponsorship or founding sponsorship.
title: "Sponsor: [your project name]"
labels: ["sponsor"]
body:
  - type: dropdown
    id: tier
    attributes:
      label: Tier
      options:
        - Featured Listing — $19/month
        - Category Sponsor — $49/month
        - Founding Sponsor — $99/month (3 slots)
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Project name
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Project link
    validations:
      required: true
  - type: input
    id: type
    attributes:
      label: Type
      description: MCP server, agent, command, CLAUDE.md, dev tool…
    validations:
      required: true
  - type: textarea
    id: pitch
    attributes:
      label: Why should readers care?
      description: One or two sentences about your project's audience and value.
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: Contact
      description: Email or X/Twitter handle for the invoice and setup.
    validations:
      required: true